[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histoseg-plugin"
version = "0.1.0"
description = "A FastAPI core for histopathology pipelines with pluggable viewer adapters"
requires-python = ">=3.10,<4"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.20,<1",
    "SQLAlchemy>=2,<3",
    "click>=8.0,<9",
    "tqdm>=4.0,<5",
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<5",
    "openslide-python>=1.3,<2",
    "pillow>=10.0,<12",
    "h5py>=3.0,<4",
    "matplotlib>=3.7,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "onnxruntime>=1.17,<2",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0,<9",
    "pytest-mock>=3.0,<4",
    "pytest-cov>=4.0,<6",
    "httpx>=0.27,<1",
]
dev = [
    "histoseg-plugin[test]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["histoseg_plugin*"]