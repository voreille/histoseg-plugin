[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histoseg-plugin"
version = "0.1.0"
description = "A FastAPI core for histopathology pipelines with pluggable viewer adapters"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "SQLAlchemy",
    "click",
    "tqdm",
    "numpy",
    "opencv-python",
    "openslide-python",
    "pillow",
    "h5py",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
]

dev = [
    "histoseg-plugin[test]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["histoseg_plugin*"]