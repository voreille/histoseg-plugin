[build-system]
requires = [
    "setuptools>=79.0.1,<80",
    "wheel>=0.46.3,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "histoseg-plugin"
version = "0.1.0"
description = "A FastAPI core for histopathology pipelines with pluggable viewer adapters"
requires-python = ">=3.10,<4"

dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "pyyaml>=6.0.3,<7",
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.4,<1",
    "SQLAlchemy>=2.0.52,<3",
    "click>=8.4.2,<9",
    "tqdm>=4.70.0,<5",
    "numpy>=1.26.4,<2",
    "opencv-python-headless>=4.11.0.86,<5",
    "openslide-python>=1.4.6,<2",
    "pillow>=11.3.0,<12",
    "h5py>=3.16.0,<4",
    "matplotlib>=3.10.9,<4",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32,<1",
    "onnxruntime>=1.23.2,<2",
    "psycopg2-binary>=2.9.12,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2,<9",
    "pytest-mock>=3.15.1,<4",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.28.1,<1",
]

dev = [
    "histoseg-plugin[test]",
    "debugpy>=1.8.21,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["histoseg_plugin*"]