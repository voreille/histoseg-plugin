x-volumes: &volumes
  - ${HOST_RESULTS_DIR:-./results}:/app/results
  - ${HOST_MODELS_DIR:-./models}:/app/models:ro
  - ${HOST_LOGS_DIR:-./logs}:/app/logs

services:
  api:
    environment:
      HISTOSEG_CONFIG: /app/config/settings.yaml
    volumes: *volumes

  worker:
    environment:
      HISTOSEG_CONFIG: /app/config/settings.yaml
    volumes: *volumes
